[project]
name = "marketplace-hub-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jef-loppes-reis", email = "jefersondip25@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]

[project.scripts]
marketplace-hub-api = "marketplace_hub_api:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_hub_api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
